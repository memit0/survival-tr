[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-offline-search"
version = "0.1.0"
description = "Local Turkish semantic retrieval with reproducible article and evidence evaluations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "snowballstemmer>=2.2,<4"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5.1,<6"]
onnx = ["sentence-transformers[onnx]>=5.1,<6"]
dev = ["pytest>=8,<10"]

[project.scripts]
tr-search = "turkish_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
